[package]
name = "gst-mxl-rs"
description = "MXL plugin"
repository = "https://github.com/dmf-mxl/mxl"
edition = "2024"
publish = false
version = "0.1.0"
license = "Apache-2.0"

[package.metadata]
install-subcommands = "cargo install cargo-deb"

[package.metadata.cargo-machete]
ignored = ["regex"]

[package.metadata.deb]
name = "dmfmxl-gst"
maintainer = "Bisect Lda. <info@bisect.pt>"
depends = "$auto, dmfmxl-dev"
assets = [
    ["target/release/libgstmxl.so", "/usr/lib/x86_64-linux-gnu/gstreamer-1.0/", "755"],
]


[dependencies]
bitstream-io = "4"
glib = "0.21.5"
gstreamer = "0.24.4"
gstreamer-audio = "0.24.4"
gstreamer-base = "0.24.4"
mxl = { path = "../mxl" }
serde_json = "1.0"
thiserror = "2.0.12"
uuid = { version = "1.17", features = ["v4", "serde"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "std"] }
tracing-test = "0.2.5"

# If this is not included, tracing won't work while debugging
regex = { version = "1", features = ["unicode-case"] }

[dev-dependencies]
gstreamer-app = "0.24.4"
gstreamer-audio = "0.24.4"
gstreamer-video = { version = "0.24.5", features = ["v1_24"] }
gst-avsynctest-rs = { path = "../gst-avsynctest-rs" }

[features]
tracing = []

[lib]
name = "gstmxl"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper = { version = "0.8.3" }
